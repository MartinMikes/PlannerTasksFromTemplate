name: Deploy Power Platform Solution

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for ad hoc production deployment
        required: true
        type: string
      rebuild_from_source:
        description: Rebuild both managed solutions from current main instead of downloading the latest release assets
        required: true
        default: false
        type: boolean

concurrency:
  group: power-platform-production
  cancel-in-progress: false

env:
  SOLUTION_NAME: CampanulaPlannerFlows
  SOLUTION_FOLDER: src/CampanulaPlannerFlows
  SOLUTION_PACK_FOLDER: out/CampanulaPlannerFlows
  SOLUTION_ZIP: out/CampanulaPlannerFlows.zip
  CONNECTOR_SOLUTION_NAME: CampanulaPlannerGraphConnector
  CONNECTOR_SOLUTION_FOLDER: src/CampanulaPlannerGraphConnector
  CONNECTOR_SOLUTION_PACK_FOLDER: out/CampanulaPlannerGraphConnector
  CONNECTOR_SOLUTION_ZIP: out/CampanulaPlannerGraphConnector.zip
  CONNECTOR_ID: aa5c469a-b5dd-4963-917c-66bf35639bb3
  CONNECTOR_ICON_FILE: src/CampanulaPlannerGraphConnector/Connectors/campa_planner_graph_icon.png
  CONNECTOR_API_DEFINITION_FILE: src/CampanulaPlannerGraphConnector/Connectors/campa_planner_graph_openapidefinition.json
  CONNECTOR_METADATA_FOLDER: out/CampanulaPlannerGraphConnector-metadata
  DEPLOYMENT_SETTINGS_FILE: out/CampanulaPlannerFlows.deployment-settings.json
  FLOW_NAME: CampanulaCreateConcertPlanFromTemplate
  FLOW_ID: 7b7d1d61-5ad2-4a81-9ee8-3e6e7c829018
  FLOW_SHARE_PRINCIPAL_TYPE: ${{ vars.FLOW_SHARE_PRINCIPAL_TYPE }}
  FLOW_SHARE_PRINCIPAL_OBJECT_ID: ${{ vars.FLOW_SHARE_PRINCIPAL_OBJECT_ID }}
  FLOW_SHARE_ROLE: ${{ vars.FLOW_SHARE_ROLE }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Pack & Import Solution
    runs-on: ubuntu-latest
    outputs:
      deployment_completed: ${{ steps.markDeploymentCompleted.outputs.deployment_completed }}
      environment_id: ${{ steps.markDeploymentCompleted.outputs.environment_id }}
    permissions:
      contents: write # create tags and releases
      issues: write # comment on released issues
      pull-requests: write # comment on merged PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # semantic-release needs full history
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Resolve last published release
        if: github.event_name == 'workflow_dispatch'
        id: manualRelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBUILD_FROM_SOURCE: ${{ inputs.rebuild_from_source }}
        run: |
          set -euo pipefail

          if [[ "$REBUILD_FROM_SOURCE" == "true" ]]; then
            echo "Manual deployment will rebuild both managed solution assets from current main."
            echo "pack_source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest published release has an unexpected tag: ${release_tag}."
            exit 1
          fi

          release_version="${release_tag#v}"
          asset_name="${SOLUTION_NAME}.zip"
          connector_asset_name="${CONNECTOR_SOLUTION_NAME}.zip"
          asset_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" \
            --jq ".assets[] | select(.name == \"${asset_name}\") | .browser_download_url")"
          connector_asset_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" \
            --jq ".assets[] | select(.name == \"${connector_asset_name}\") | .browser_download_url")"

          mkdir -p out
          rm -f "${SOLUTION_ZIP}"
          rm -f "${CONNECTOR_SOLUTION_ZIP}"

          if [[ -n "$asset_url" && -n "$connector_asset_url" ]]; then
            gh release download "$release_tag" \
              --pattern "$asset_name" \
              --dir out \
              --clobber
            gh release download "$release_tag" \
              --pattern "$connector_asset_name" \
              --dir out \
              --clobber
            if [[ ! -s "${SOLUTION_ZIP}" || ! -s "${CONNECTOR_SOLUTION_ZIP}" ]]; then
              echo "::error::Release ${release_tag} did not provide usable managed solution assets."
              exit 1
            fi
            echo "Downloaded the managed solution assets from ${release_tag}."
            echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
            echo "pack_source=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_commit="$(
            git log --all --format='%H%x09%s' |
              awk -F '\t' -v expected="chore: update solution version to ${release_version}.0 [skip ci]" \
                '$2 == expected && !found { print $1; found=1 }'
          )"
          if [[ -z "$version_commit" ]]; then
            echo "::error::Release ${release_tag} has no managed solution asset and no matching solution-version commit."
            exit 1
          fi

          git checkout --detach "$version_commit"
          if [[ ! -f "${CONNECTOR_SOLUTION_FOLDER}/Other/Solution.xml" ]]; then
            echo "::error::Release ${release_tag} predates the prerequisite connector solution. Publish a new split release before using this manual deployment path."
            exit 1
          fi
          echo "Release ${release_tag} has no asset; rebuilding from ${version_commit}."
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "pack_source=true" >> "$GITHUB_OUTPUT"

      - name: Validate required configuration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          PACK_SOURCE: ${{ steps.manualRelease.outputs.pack_source }}
          PP_ENVIRONMENT_URL: ${{ vars.PP_ENVIRONMENT_URL }}
          PP_ENVIRONMENT_ID: ${{ vars.PP_ENVIRONMENT_ID }}
          PP_APP_ID: ${{ vars.PP_APP_ID }}
          PP_TENANT_ID: ${{ vars.PP_TENANT_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          FLOW_SHARE_PRINCIPAL_TYPE: ${{ vars.FLOW_SHARE_PRINCIPAL_TYPE }}
          FLOW_SHARE_PRINCIPAL_OBJECT_ID: ${{ vars.FLOW_SHARE_PRINCIPAL_OBJECT_ID }}
          FLOW_SHARE_ROLE: ${{ vars.FLOW_SHARE_ROLE }}
          PP_CONNECTOR_APP_ID: ${{ vars.PP_CONNECTOR_APP_ID }}
          PP_FORMS_CONNECTION_ID: ${{ vars.PP_FORMS_CONNECTION_ID }}
          PP_EXCEL_CONNECTION_ID: ${{ vars.PP_EXCEL_CONNECTION_ID }}
          PP_PLANNER_CONNECTION_ID: ${{ vars.PP_PLANNER_CONNECTION_ID }}
          PP_GRAPH_CONNECTION_ID: ${{ vars.PP_GRAPH_CONNECTION_ID }}
          PP_OUTLOOK_CONNECTION_ID: ${{ vars.PP_OUTLOOK_CONNECTION_ID }}
        run: |
          set -euo pipefail

          require_value() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::${name} is not set. Add it under Settings → Secrets and variables → Actions before deploying."
              exit 1
            fi
          }

          require_guid() {
            local name="$1"
            local value="$2"
            require_value "$name" "$value"
            local normalized="${value,,}"
            case "$normalized" in
              todo|to-do|tbd|change-me|changeme|placeholder|example|sample|dummy|set-me)
                echo "::error::${name} is still set to the placeholder value '${value}'. Replace it with the real target-environment ID before deploying."
                exit 1
                ;;
            esac
            if [[ ! "$value" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "::error::${name} must be a GUID. Copy the real target-environment ID from Power Apps or Microsoft Entra before deploying."
              exit 1
            fi
          }

          require_connection_resource_id() {
            local name="$1"
            local value="$2"
            require_value "$name" "$value"
            local normalized="${value,,}"
            case "$normalized" in
              todo|to-do|tbd|change-me|changeme|placeholder|example|sample|dummy|set-me)
                echo "::error::${name} is still set to the placeholder value '${value}'. Replace it with the real target-environment ID before deploying."
                exit 1
                ;;
            esac
            if [[ ! "$value" =~ [0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12} ]]; then
              echo "::error::${name} must contain a GUID from a target Power Platform connection resource ID before deploying."
              exit 1
            fi
          }

          reject_connector_id_as_app_id() {
            local value="$1"
            if [[ "${value,,}" == "${CONNECTOR_ID,,}" ]]; then
              echo "::error::PP_CONNECTOR_APP_ID is set to the custom connector ID. Use the Application (client) ID of the connector's Entra app registration instead."
              exit 1
            fi
          }

          require_value "PP_ENVIRONMENT_URL" "$PP_ENVIRONMENT_URL"
          require_guid "PP_ENVIRONMENT_ID" "$PP_ENVIRONMENT_ID"
          require_guid "PP_APP_ID" "$PP_APP_ID"
          require_guid "PP_TENANT_ID" "$PP_TENANT_ID"
          require_value "PP_CLIENT_SECRET" "$PP_CLIENT_SECRET"
          require_value "FLOW_SHARE_PRINCIPAL_TYPE" "$FLOW_SHARE_PRINCIPAL_TYPE"
          case "$FLOW_SHARE_PRINCIPAL_TYPE" in
            User|Group) ;;
            *)
              echo "::error::FLOW_SHARE_PRINCIPAL_TYPE must be User or Group."
              exit 1
              ;;
          esac
          require_guid "FLOW_SHARE_PRINCIPAL_OBJECT_ID" "$FLOW_SHARE_PRINCIPAL_OBJECT_ID"
          require_value "FLOW_SHARE_ROLE" "$FLOW_SHARE_ROLE"
          case "$FLOW_SHARE_ROLE" in
            CanView|CanEdit) ;;
            *)
              echo "::error::FLOW_SHARE_ROLE must be CanView or CanEdit. CanUse is a connection permission, not a Flow owner role."
              exit 1
              ;;
          esac
          require_connection_resource_id "PP_FORMS_CONNECTION_ID" "$PP_FORMS_CONNECTION_ID"
          require_connection_resource_id "PP_EXCEL_CONNECTION_ID" "$PP_EXCEL_CONNECTION_ID"
          require_connection_resource_id "PP_PLANNER_CONNECTION_ID" "$PP_PLANNER_CONNECTION_ID"
          require_connection_resource_id "PP_GRAPH_CONNECTION_ID" "$PP_GRAPH_CONNECTION_ID"
          require_connection_resource_id "PP_OUTLOOK_CONNECTION_ID" "$PP_OUTLOOK_CONNECTION_ID"

          reject_connection_id_confusion() {
            local connection_name="$1"
            local connection_value="$2"
            local other_name="$3"
            local other_value="$4"
            if [[ -n "$other_value" && "${connection_value,,}" == "${other_value,,}" ]]; then
              echo "::error::${connection_name} must be the target Power Platform connection resource ID, not ${other_name}."
              exit 1
            fi
          }

          reject_connection_id_confusion "PP_GRAPH_CONNECTION_ID" "$PP_GRAPH_CONNECTION_ID" "PP_CONNECTOR_APP_ID" "$PP_CONNECTOR_APP_ID"
          reject_connection_id_confusion "PP_GRAPH_CONNECTION_ID" "$PP_GRAPH_CONNECTION_ID" "PP_APP_ID" "$PP_APP_ID"
          reject_connection_id_confusion "PP_GRAPH_CONNECTION_ID" "$PP_GRAPH_CONNECTION_ID" "PP_TENANT_ID" "$PP_TENANT_ID"
          reject_connection_id_confusion "PP_GRAPH_CONNECTION_ID" "$PP_GRAPH_CONNECTION_ID" "the custom connector component ID" "$CONNECTOR_ID"

          if [[ "$GITHUB_EVENT_NAME" == "push" || "$PACK_SOURCE" == "true" ]]; then
            require_guid "PP_CONNECTOR_APP_ID" "$PP_CONNECTOR_APP_ID"
            reject_connector_id_as_app_id "$PP_CONNECTOR_APP_ID"
          fi

      - name: Determine release version
        if: github.event_name == 'push'
        id: semanticRelease
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25 # pin to match package.json ^25.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip deploy when there is no release
        if: github.event_name == 'push' && steps.semanticRelease.outputs.new_release_published != 'true'
        run: echo "semantic-release did not publish a release, so automatic deployment is skipped."

      - name: Show ad hoc deploy reason
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          echo "Ad hoc production deployment requested by ${{ github.actor }}."
          stop_marker="$(uuidgen)"
          echo "::stop-commands::${stop_marker}"
          echo "Reason: ${DEPLOY_REASON}"
          echo "::${stop_marker}::"

      - name: Install Power Platform CLI
        if: github.event_name == 'workflow_dispatch' || steps.semanticRelease.outputs.new_release_published == 'true'
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Set solution versions
        if: steps.semanticRelease.outputs.new_release_published == 'true'
        run: |
          set -euo pipefail
          VER="${{ steps.semanticRelease.outputs.new_release_version }}.0"
          for solution_folder in \
            "${{ env.SOLUTION_FOLDER }}" \
            "${{ env.CONNECTOR_SOLUTION_FOLDER }}"; do
            solution_file="${solution_folder}/Other/Solution.xml"
            if ! grep -Eq '<Version>[^<]+</Version>' "$solution_file"; then
              echo "::error::Missing <Version> element in ${solution_file}."
              exit 1
            fi
            sed -i "s|<Version>.*</Version>|<Version>${VER}</Version>|" "$solution_file"
            if ! grep -Fq "<Version>${VER}</Version>" "$solution_file"; then
              echo "::error::Failed to set ${solution_file} to version ${VER}."
              exit 1
            fi
          done
          echo "Solution versions: ${VER}"

      - name: Commit updated solution versions
        if: steps.semanticRelease.outputs.new_release_published == 'true'
        run: |
          VER="${{ steps.semanticRelease.outputs.new_release_version }}.0"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            "${{ env.SOLUTION_FOLDER }}/Other/Solution.xml" \
            "${{ env.CONNECTOR_SOLUTION_FOLDER }}/Other/Solution.xml"
          if git diff --cached --quiet; then
            echo "Solution.xml already at ${VER}, nothing to commit."
          else
            git commit -m "chore: update solution version to ${VER} [skip ci]"
            git push
          fi

      - name: Authenticate with Power Platform
        if: github.event_name == 'workflow_dispatch' || steps.semanticRelease.outputs.new_release_published == 'true'
        run: |
          "$POWERPLATFORMTOOLS_PACPATH" auth create \
            --environment   "${{ vars.PP_ENVIRONMENT_URL }}" \
            --applicationId "${{ vars.PP_APP_ID }}" \
            --clientSecret  "${{ secrets.PP_CLIENT_SECRET }}" \
            --tenant        "${{ vars.PP_TENANT_ID }}"

      - name: Prepare staged solution source
        if: steps.manualRelease.outputs.pack_source == 'true' || steps.semanticRelease.outputs.new_release_published == 'true'
        run: |
          mkdir -p out
          rm -rf "${{ env.SOLUTION_PACK_FOLDER }}"
          rm -rf "${{ env.CONNECTOR_SOLUTION_PACK_FOLDER }}"
          cp -R "${{ env.SOLUTION_FOLDER }}" "${{ env.SOLUTION_PACK_FOLDER }}"
          cp -R "${{ env.CONNECTOR_SOLUTION_FOLDER }}" "${{ env.CONNECTOR_SOLUTION_PACK_FOLDER }}"

      - name: Inject connector app ID
        if: steps.manualRelease.outputs.pack_source == 'true' || steps.semanticRelease.outputs.new_release_published == 'true'
        env:
          PP_CONNECTOR_APP_ID: ${{ vars.PP_CONNECTOR_APP_ID }}
        run: |
          if [ -z "$PP_CONNECTOR_APP_ID" ]; then
            echo "::error::PP_CONNECTOR_APP_ID variable is not set. Add it under Settings → Secrets and variables → Actions → Variables before deploying."
            exit 1
          fi
          PARAMS_FILE="${{ env.CONNECTOR_SOLUTION_PACK_FOLDER }}/Connectors/campa_planner_graph_connectionparameters.json"
          if ! grep -Fq '${MICROSOFT_ENTRA_APP_ID}' "$PARAMS_FILE"; then
            echo "::error::Expected placeholder \${MICROSOFT_ENTRA_APP_ID} not found in $PARAMS_FILE. Ensure the connector source still contains the placeholder."
            exit 1
          fi
          sed -i "s|\${MICROSOFT_ENTRA_APP_ID}|${PP_CONNECTOR_APP_ID}|g" "$PARAMS_FILE"
          if grep -Fq '${MICROSOFT_ENTRA_APP_ID}' "$PARAMS_FILE" || ! grep -Fq "$PP_CONNECTOR_APP_ID" "$PARAMS_FILE"; then
            echo "::error::Connector app ID injection did not take effect in $PARAMS_FILE."
            exit 1
          fi
          echo "Connector app ID injected into ${PARAMS_FILE}."

      - name: Create solution zips
        if: steps.manualRelease.outputs.pack_source == 'true' || steps.semanticRelease.outputs.new_release_published == 'true'
        run: |
          "$POWERPLATFORMTOOLS_PACPATH" solution pack \
            --zipFile "${{ env.SOLUTION_ZIP }}" \
            --folder "${{ env.SOLUTION_PACK_FOLDER }}" \
            --packageType Managed
          "$POWERPLATFORMTOOLS_PACPATH" solution pack \
            --zipFile "${{ env.CONNECTOR_SOLUTION_ZIP }}" \
            --folder "${{ env.CONNECTOR_SOLUTION_PACK_FOLDER }}" \
            --packageType Managed

      - name: Create deployment settings file
        if: github.event_name == 'workflow_dispatch' || steps.semanticRelease.outputs.new_release_published == 'true'
        env:
          PP_FORMS_CONNECTION_ID: ${{ vars.PP_FORMS_CONNECTION_ID }}
          PP_EXCEL_CONNECTION_ID: ${{ vars.PP_EXCEL_CONNECTION_ID }}
          PP_PLANNER_CONNECTION_ID: ${{ vars.PP_PLANNER_CONNECTION_ID }}
          PP_GRAPH_CONNECTION_ID: ${{ vars.PP_GRAPH_CONNECTION_ID }}
          PP_OUTLOOK_CONNECTION_ID: ${{ vars.PP_OUTLOOK_CONNECTION_ID }}
        run: |
          set -euo pipefail

          settings_file="${{ env.DEPLOYMENT_SETTINGS_FILE }}"
          temporary_file="${settings_file}.tmp"
          "$POWERPLATFORMTOOLS_PACPATH" solution create-settings \
            --solution-zip "${{ env.SOLUTION_ZIP }}" \
            --settings-file "$settings_file"

          jq \
            --arg forms "$PP_FORMS_CONNECTION_ID" \
            --arg excel "$PP_EXCEL_CONNECTION_ID" \
            --arg planner "$PP_PLANNER_CONNECTION_ID" \
            --arg graph "$PP_GRAPH_CONNECTION_ID" \
            --arg outlook "$PP_OUTLOOK_CONNECTION_ID" \
            '
              (.ConnectionReferences[] | select(.LogicalName == "campa_sharedmicrosoftforms_createconcertplan") | .ConnectionId) = $forms
              | (.ConnectionReferences[] | select(.LogicalName == "campa_sharedexcelonlinebusiness_createconcertplan") | .ConnectionId) = $excel
              | (.ConnectionReferences[] | select(.LogicalName == "campa_sharedplanner_createconcertplan") | .ConnectionId) = $planner
              | (.ConnectionReferences[] | select(.LogicalName == "campa_sharedcampanulaplannergraph_createconcertplan") | .ConnectionId) = $graph
              | (.ConnectionReferences[] | select(.LogicalName == "campa_sharedoffice365_createconcertplan") | .ConnectionId) = $outlook
            ' "$settings_file" > "$temporary_file"
          mv "$temporary_file" "$settings_file"

          expected_references='[
            "campa_sharedmicrosoftforms_createconcertplan",
            "campa_sharedexcelonlinebusiness_createconcertplan",
            "campa_sharedplanner_createconcertplan",
            "campa_sharedcampanulaplannergraph_createconcertplan",
            "campa_sharedoffice365_createconcertplan"
          ]'
          if ! jq -e --argjson expected "$expected_references" '
            (.ConnectionReferences // []) as $references
            | (($references | map(.LogicalName) | sort) == ($expected | sort))
              and ([$references[]? | select((.ConnectionId // "") == "")] | length == 0)
          ' "$settings_file" >/dev/null; then
            echo "::error::Deployment settings must contain exactly the five expected connection references, each with a target connection ID."
            exit 1
          fi
          echo "Deployment settings created for the five expected solution connection references."

      - name: Upload packed solution as artifact
        if: github.event_name == 'workflow_dispatch' || steps.semanticRelease.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SOLUTION_NAME }}
          path: |
            ${{ env.SOLUTION_ZIP }}
            ${{ env.CONNECTOR_SOLUTION_ZIP }}
          retention-days: 30

      - name: Import Graph connector prerequisite solution
        if: github.event_name == 'workflow_dispatch' || steps.semanticRelease.outputs.new_release_published == 'true'
        run: |
          set -euo pipefail
          "$POWERPLATFORMTOOLS_PACPATH" solution import \
            --path "${{ env.CONNECTOR_SOLUTION_ZIP }}" \
            --force-overwrite \
            --publish-changes

      - name: Select connector metadata from deployed artifact
        id: connectorMetadata
        if: github.event_name == 'workflow_dispatch' || steps.semanticRelease.outputs.new_release_published == 'true'
        run: |
          set -euo pipefail

          if [[ "${{ steps.manualRelease.outputs.pack_source }}" == "false" ]]; then
            metadata_folder="${{ env.CONNECTOR_METADATA_FOLDER }}"
            rm -rf "$metadata_folder"
            mkdir -p "$metadata_folder"

            api_definition_file="$metadata_folder/campa_planner_graph_openapidefinition.json"
            icon_file="$metadata_folder/campa_planner_graph_icon.png"
            unzip -p "${{ env.CONNECTOR_SOLUTION_ZIP }}" \
              Connector/campa_planner_graph_openapidefinition.json > "$api_definition_file"

            release_tag="${{ steps.manualRelease.outputs.release_tag }}"
            git show "${release_tag}:src/CampanulaPlannerGraphConnector/Connectors/campa_planner_graph_icon.png" > "$icon_file"
          else
            api_definition_file="${{ env.CONNECTOR_SOLUTION_PACK_FOLDER }}/Connectors/campa_planner_graph_openapidefinition.json"
            icon_file="${{ env.CONNECTOR_SOLUTION_PACK_FOLDER }}/Connectors/campa_planner_graph_icon.png"
          fi

          if [ ! -s "$api_definition_file" ]; then
            echo "::error::Connector API definition is missing or empty: $api_definition_file"
            exit 1
          fi
          if [ ! -s "$icon_file" ]; then
            echo "::error::Connector icon is missing or empty: $icon_file"
            exit 1
          fi

          echo "api_definition_file=$api_definition_file" >> "$GITHUB_OUTPUT"
          echo "icon_file=$icon_file" >> "$GITHUB_OUTPUT"

      - name: Apply Graph connector icon
        if: github.event_name == 'workflow_dispatch' || steps.semanticRelease.outputs.new_release_published == 'true'
        run: |
          set -euo pipefail
          icon_file="${{ steps.connectorMetadata.outputs.icon_file }}"
          api_definition_file="${{ steps.connectorMetadata.outputs.api_definition_file }}"
          "$POWERPLATFORMTOOLS_PACPATH" connector update \
            --environment "${{ vars.PP_ENVIRONMENT_URL }}" \
            --connector-id "${{ env.CONNECTOR_ID }}" \
            --api-definition-file "$api_definition_file" \
            --icon-file "$icon_file"

      - name: Import solution to Power Platform
        if: github.event_name == 'workflow_dispatch' || steps.semanticRelease.outputs.new_release_published == 'true'
        run: |
          set -euo pipefail
          "$POWERPLATFORMTOOLS_PACPATH" --log-to-console solution import \
            --path "${{ env.SOLUTION_ZIP }}" \
            --force-overwrite \
            --publish-changes \
            --activate-plugins \
            --settings-file "${{ env.DEPLOYMENT_SETTINGS_FILE }}"

      - name: Mark solution deployment complete
        id: markDeploymentCompleted
        if: github.event_name == 'workflow_dispatch' || steps.semanticRelease.outputs.new_release_published == 'true'
        env:
          PP_ENVIRONMENT_ID: ${{ vars.PP_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          echo "deployment_completed=true" >> "$GITHUB_OUTPUT"
          echo "environment_id=$PP_ENVIRONMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Attach validated solution zips to GitHub release
        if: steps.semanticRelease.outputs.new_release_published == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.semanticRelease.outputs.new_release_git_tag }}
          files: |
            ${{ env.SOLUTION_ZIP }}
            ${{ env.CONNECTOR_SOLUTION_ZIP }}

  activate-and-share-flow:
    name: Activate and Share Flow
    needs: build-and-deploy
    if: needs.build-and-deploy.result == 'success' && needs.build-and-deploy.outputs.deployment_completed == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PP_ENVIRONMENT_ID: ${{ needs.build-and-deploy.outputs.environment_id }}
      PP_TENANT_ID: ${{ vars.PP_TENANT_ID }}
      PP_APP_ID: ${{ vars.PP_APP_ID }}
      PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}

    steps:
      - name: Validate Flow post-deployment configuration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $guidPattern = '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

          foreach ($entry in @(
            @{ Name = 'PP_ENVIRONMENT_ID'; Value = $env:PP_ENVIRONMENT_ID },
            @{ Name = 'PP_TENANT_ID'; Value = $env:PP_TENANT_ID },
            @{ Name = 'PP_APP_ID'; Value = $env:PP_APP_ID },
            @{ Name = 'FLOW_SHARE_PRINCIPAL_OBJECT_ID'; Value = $env:FLOW_SHARE_PRINCIPAL_OBJECT_ID }
          )) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "$($entry.Name) is not set."
            }
            if ($entry.Value -notmatch $guidPattern) {
              throw "$($entry.Name) must be a GUID."
            }
          }

          if ([string]::IsNullOrWhiteSpace($env:PP_CLIENT_SECRET)) {
            throw 'PP_CLIENT_SECRET is not set.'
          }
          if (@('User', 'Group') -notcontains $env:FLOW_SHARE_PRINCIPAL_TYPE) {
            throw 'FLOW_SHARE_PRINCIPAL_TYPE must be User or Group.'
          }
          if (@('CanView', 'CanEdit') -notcontains $env:FLOW_SHARE_ROLE) {
            throw 'FLOW_SHARE_ROLE must be CanView or CanEdit. CanUse is a connection permission, not a Flow owner role.'
          }

      - name: Install Power Platform administration module
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module `
            -Name Microsoft.PowerApps.Administration.PowerShell `
            -Repository PSGallery `
            -Scope CurrentUser `
            -Force `
            -AllowClobber
          Import-Module Microsoft.PowerApps.Administration.PowerShell

      - name: Authenticate Power Platform administration module
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-PowerAppsAccount `
            -Endpoint prod `
            -TenantID $env:PP_TENANT_ID `
            -ApplicationId $env:PP_APP_ID `
            -ClientSecret $env:PP_CLIENT_SECRET

      - name: Enable and share deployed Flow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $flowCandidates = @(Get-AdminFlow `
            -EnvironmentName $env:PP_ENVIRONMENT_ID `
            -FlowName $env:FLOW_ID)
          $flowMatches = @($flowCandidates | Where-Object {
            $_.FlowName -eq $env:FLOW_ID -and
            $_.DisplayName -eq $env:FLOW_NAME
          })
          if ($flowMatches.Count -ne 1) {
            throw "Expected Flow '$($env:FLOW_ID)' with display name '$($env:FLOW_NAME)' in environment '$($env:PP_ENVIRONMENT_ID)', found $($flowMatches.Count) matching result(s)."
          }

          $flowId = [string]$flowMatches[0].FlowName
          if ($flowId -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') {
            throw "Power Platform returned an invalid Flow ID for '$($env:FLOW_NAME)'."
          }

          Enable-AdminFlow `
            -EnvironmentName $env:PP_ENVIRONMENT_ID `
            -FlowName $flowId

          Set-AdminFlowOwnerRole `
            -EnvironmentName $env:PP_ENVIRONMENT_ID `
            -FlowName $flowId `
            -PrincipalType $env:FLOW_SHARE_PRINCIPAL_TYPE `
            -RoleName $env:FLOW_SHARE_ROLE `
            -PrincipalObjectId $env:FLOW_SHARE_PRINCIPAL_OBJECT_ID

          $flowAfter = Get-AdminFlow `
            -EnvironmentName $env:PP_ENVIRONMENT_ID `
            -FlowName $flowId
          if (-not $flowAfter.Enabled) {
            throw "Flow '$($env:FLOW_NAME)' was not activated."
          }

          $ownerRoles = @(Get-AdminFlowOwnerRole `
            -EnvironmentName $env:PP_ENVIRONMENT_ID `
            -FlowName $flowId)
          $matchingRoles = @($ownerRoles | Where-Object {
            $_.PrincipalObjectId -eq $env:FLOW_SHARE_PRINCIPAL_OBJECT_ID -and
            $_.PrincipalType -eq $env:FLOW_SHARE_PRINCIPAL_TYPE -and
            $_.RoleType -eq $env:FLOW_SHARE_ROLE
          })
          if ($matchingRoles.Count -lt 1) {
            throw "Flow '$($env:FLOW_NAME)' does not have the requested $($env:FLOW_SHARE_ROLE) role for $($env:FLOW_SHARE_PRINCIPAL_TYPE) '$($env:FLOW_SHARE_PRINCIPAL_OBJECT_ID)'."
          }

          Write-Host "Flow '$($env:FLOW_NAME)' is enabled and shared as $($env:FLOW_SHARE_ROLE) with $($env:FLOW_SHARE_PRINCIPAL_TYPE) '$($env:FLOW_SHARE_PRINCIPAL_OBJECT_ID)'."
