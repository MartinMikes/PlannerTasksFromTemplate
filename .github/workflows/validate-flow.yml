name: Validate flow before deployment

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate-flow.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Flow definition and activation tests (no production writes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/typecheck-workflow.mjs
      - run: node --test test/*.test.js
